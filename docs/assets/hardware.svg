<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="390" viewBox="0 0 1400 390"><rect width="1400" height="390" rx="30" fill="#0b0e18"/><text x="55" y="70" fill="#f8fafc" font-family="Arial" font-size="34" font-weight="800">Predator Laptop Memory Strategy</text><text x="55" y="106" fill="#94a3b8" font-family="Arial" font-size="18">Designed around the real bottlenecks: 6 GB VRAM and 16 GB system RAM.</text><g font-family="Arial"><rect x="55" y="150" width="385" height="150" rx="24" fill="#151827" stroke="#8b5cf6"/><text x="85" y="192" fill="#c4b5fd" font-size="19" font-weight="700">RTX 4050 • 6 GB VRAM</text><text x="85" y="232" fill="#cbd5e1" font-size="17">• 8-bit transformer</text><text x="85" y="262" fill="#cbd5e1" font-size="17">• ~5 GiB GPU budget</text><rect x="505" y="150" width="385" height="150" rx="24" fill="#151827" stroke="#06b6d4"/><text x="535" y="192" fill="#67e8f9" font-size="19" font-weight="700">16 GB System RAM</text><text x="535" y="232" fill="#cbd5e1" font-size="17">• 8-bit T5 encoder</text><text x="535" y="262" fill="#cbd5e1" font-size="17">• ~8 GiB CPU budget</text><rect x="955" y="150" width="390" height="150" rx="24" fill="#151827" stroke="#22c55e"/><text x="985" y="192" fill="#86efac" font-size="19" font-weight="700">Long Story Output</text><text x="985" y="232" fill="#cbd5e1" font-size="17">• 4–8 sec scene chunks</text><text x="985" y="262" fill="#cbd5e1" font-size="17">• stream-safe FFmpeg assembly</text></g><text x="55" y="345" fill="#64748b" font-family="Arial" font-size="15">1080p export is a delivery resize; native 1080p diffusion is intentionally disabled for this hardware profile.</text></svg>