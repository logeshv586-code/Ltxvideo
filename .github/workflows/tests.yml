name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install psutil

      - name: Syntax check
        run: |
          python -m py_compile app.py config.py run.py diagnostics.py download_models.py engine/*.py tests/*.py

      - name: Unit tests
        run: |
          python -m unittest discover -s tests -v
