name: tests

on:
  workflow_dispatch:

jobs:
  compatibility-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python -m py_compile app.py config.py run.py diagnostics.py download_models.py engine/*.py tests/*.py

      - name: RTX 3050 / 4050 profile tests
        run: |
          python -m unittest tests.test_hardware_profiles tests.test_diagnostics -v
